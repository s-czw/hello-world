server:
  port: 8080

spring:
  application:
    name: cairn-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/cairn}
    username: ${SPRING_DATASOURCE_USERNAME:cairn}
    password: ${SPRING_DATASOURCE_PASSWORD:cairn}
    hikari:
      pool-name: cairn-pool
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
  jooq:
    sql-dialect: POSTGRES
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 500ms
      connect-timeout: 500ms

cairn:
  auth:
    jwt:
      # Dev default only; production MUST set AUTH_JWT_SECRET (>= 32 bytes).
      secret: ${AUTH_JWT_SECRET:dev-only-insecure-cairn-jwt-signing-secret-change-me}
      access-ttl-seconds: 900          # 15 minutes
      refresh-ttl-seconds: 604800      # 7 days
    cookie:
      secure: ${AUTH_COOKIE_SECURE:false}
    local:
      enabled: ${AUTH_LOCAL_ENABLED:true}
    ratelimit:
      enabled: ${AUTH_RATELIMIT_ENABLED:true}
      max-attempts: 5
      window-seconds: 60
  invite:
    ttl-days: 14
    accept-url-base: ${APP_PUBLIC_URL:http://localhost:3000}/accept-invite

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/docs/swagger

logging:
  level:
    root: INFO
