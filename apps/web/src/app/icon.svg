<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="Cairn">
  <title>Cairn</title>
  <!-- Brand mark: the indigo rounded square from the sidebar (--accent #4f46e5) with the
       cairn motif — three stacked stones, widest at the base. -->
  <rect width="32" height="32" rx="7" fill="#4f46e5" />
  <g fill="#ffffff">
    <rect x="12" y="7" width="8" height="5" rx="2.5" />
    <rect x="10" y="13.5" width="12" height="5" rx="2.5" />
    <rect x="8" y="20" width="16" height="5" rx="2.5" />
  </g>
</svg>
